name: Verify actions lockfile

on:
  push:
    branches: [main]
  pull_request:
  # Started by update.yml for its PR branch, like Build.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify actions lockfile
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: gh extension install github/gh-actions-lock --pin v0.3.0
      # Fails on missing lockfile entries or locked commits that no longer match upstream.
      - run: gh actions-lock --verify
