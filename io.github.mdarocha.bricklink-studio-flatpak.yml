id: io.github.mdarocha.bricklink-studio-flatpak
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: bricklink-studio
# Wine 11.0, winetricks and cabextract come from Flathub's Wine base app.
base: org.winehq.Wine
base-version: stable-26.08
# For cross-compiling the patched Wine DLLs.
sdk-extensions:
  - org.freedesktop.Sdk.Extension.mingw-w64

finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  # BrickLink catalog, sign-in and part library downloads.
  - --share=network
  # Wine's Documents, Pictures and Downloads folders are linked to these.
  - --filesystem=xdg-documents
  - --filesystem=xdg-pictures
  - --filesystem=xdg-download
  # Host paths of the XDG folders, which may be localized (~/Dokumenty, ~/Bilder, ...).
  - --filesystem=xdg-config/user-dirs.dirs:ro
  - --env=WINEPREFIX=/var/data/prefix
  - --env=WINEDEBUG=-all
  # No Wine Mono or Gecko is shipped; disabling them stops Wine offering to download them.
  - --env=WINEDLLOVERRIDES=winemenubuilder.exe=d;mscoree,mshtml=
  # Makes the patched wined3d fail Unity's video decoding device, so Unity decodes in software.
  - --env=WINE_D3D_CONFIG=no_create_flags=0x800

cleanup-commands:
  # Keep the base app's own launchers and store entries out of the app.
  - rm -rf /app/share/applications/org.winehq.Wine.desktop /app/share/applications/winetricks.desktop
      /app/share/metainfo/org.winehq.Wine*.xml /app/share/metainfo/io.github.winetricks.Winetricks.metainfo.xml
      /app/share/app-info/xmls/org.winehq.Wine.xml.gz /app/share/app-info/icons/flatpak/*/org.winehq.Wine.png
      /app/share/app-info/media/org/winehq

modules:
  # Unpacks Studio's Inno Setup installer natively; under Wine the installer takes minutes.
  - name: innoextract
    buildsystem: cmake-ninja
    build-options:
      env:
        CMAKE_POLICY_VERSION_MINIMUM: '3.5'
    license-files:
      - LICENSE
    config-opts:
      - -DBoost_USE_STATIC_LIBS=ON
    cleanup:
      - /share/man
    sources:
      # No innoextract release reads Inno Setup 6.7, which Studio uses; this is the reviewed
      # head of dscharrer/innoextract#205.
      - type: archive
        url: https://github.com/dscharrer/innoextract/archive/e8960a05eef5ea218bf05a1e23adc3f688c3d5b5.tar.gz
        sha256: 7d3a3b59a3aa086bd5aad0b3a2f46992ebb976efcb7ac8192eafbff915dd3b1c
      - type: patch
        path: patches/innoextract-studio.patch
    modules:
      - name: boost
        buildsystem: simple
        build-commands:
          - ./bootstrap.sh --prefix=${FLATPAK_DEST} --with-libraries=date_time,filesystem,iostreams,program_options
          - ./b2 -j${FLATPAK_BUILDER_N_JOBS} link=static install
        cleanup:
          - '*'
        sources:
          - type: archive
            url: https://archives.boost.io/release/1.91.0/source/boost_1_91_0.tar.gz
            sha256: 5734305f40a76c30f951c9abd409a45a2a19fb546efe4162119250bbe4d3a463

  # Patched dxgi and wined3d so Unity videos play; see patches/wine-unity-video.patch.
  - name: wine-unity-video
    buildsystem: simple
    build-options:
      append-path: /usr/lib/sdk/mingw-w64/bin
    license-files:
      - COPYING.LIB
    build-commands:
      # Replaces the base app's DLLs, so must be the same Wine release.
      - test "$(wine --version)" = wine-11.0
      - mkdir build
      - cd build && ../configure --enable-archs=x86_64 --disable-tests --without-x --without-freetype
      - make -C build -j${FLATPAK_BUILDER_N_JOBS} dlls/dxgi/x86_64-windows/dxgi.dll dlls/wined3d/x86_64-windows/wined3d.dll
      - x86_64-w64-mingw32-strip build/dlls/dxgi/x86_64-windows/dxgi.dll build/dlls/wined3d/x86_64-windows/wined3d.dll
      - install -m644 build/dlls/dxgi/x86_64-windows/dxgi.dll build/dlls/wined3d/x86_64-windows/wined3d.dll
          -t /app/lib/wine/x86_64-windows
    sources:
      - type: archive
        url: https://dl.winehq.org/wine/source/11.0/wine-11.0.tar.xz
        sha256: c07a6857933c1fc60dff5448d79f39c92481c1e9db5aa628db9d0358446e0701
      - type: patch
        path: patches/wine-unity-video.patch

  - name: bricklink-studio
    buildsystem: simple
    license-files:
      - LICENSE
    build-commands:
      - install -Dm755 src/apply_extra.sh /app/bin/apply_extra
      - install -Dm755 src/bricklink-studio.sh /app/bin/bricklink-studio
      - install -Dm644 data/${FLATPAK_ID}.desktop -t /app/share/applications
      - install -Dm644 data/${FLATPAK_ID}.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/${FLATPAK_ID}.mime.xml /app/share/mime/packages/${FLATPAK_ID}.xml
      - install -Dm644 data/${FLATPAK_ID}.svg -t /app/share/icons/hicolor/scalable/apps
      - install -Dm644 data/${FLATPAK_ID}.model.svg -t /app/share/icons/hicolor/scalable/mimetypes
    sources:
      - type: file
        path: LICENSE
      - type: dir
        path: src
        dest: src
      - type: dir
        path: data
        dest: data
      # Downloaded from BrickLink by Flatpak on the user's machine at install time;
      # the installer is never part of this repository or the published Flatpak repo.
      # Kept current by scripts/upstream.py (see .github/workflows/update.yml).
      - type: extra-data
        url: https://studio.download.bricklink.info/Studio2.0/Archive/2.26.9_1/Studio+2.0.exe
        sha256: 30764aef4715d22b9beaba1fe9734494f12247b0db75d4e2100ffd9c15d9c1d9
        size: 443516320
        filename: Studio+2.0.exe
